<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Приглашение на свадьбу</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Forum&family=Great+Vibes&family=Jost:wght@400;500&display=swap&subset=cyrillic">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <img class="hero-photo" src="photo.jpg" alt="" fetchpriority="high">
    <div class="hero-top">
      <p class="hero-couple" id="couple" hidden></p>
    </div>
    <div class="hero-bottom">
      <h1 class="guest" id="guest"></h1>
      <p class="hero-invited" data-text="invited"></p>
      <button class="hero-more" id="more" type="button" aria-label="Подробнее">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
      </button>
    </div>
  </header>

  <main class="invite">
    <section class="when" id="when">
      <p class="when-date" id="date" hidden>
        <span id="date-day"></span>
        <span id="date-month"></span>
        <span id="date-year"></span>
      </p>
      <p class="when-time" id="time"></p>
    </section>

    <p class="message" data-text="message"></p>

    <dl class="details">
      <div>
        <dt data-text="place"></dt>
        <dd>
          <span class="details-venue" id="venue"></span>
          <span class="details-address" id="address"></span>
        </dd>
      </div>
    </dl>

    <section class="place">
      <h2 data-text="directions"></h2>
      <iframe class="map" id="map" loading="lazy" allowfullscreen></iframe>
      <div class="map-links">
        <a class="button button-primary" id="yandex-link" target="_blank" rel="noopener" data-text="yandex"></a>
        <a class="button" id="google-link" target="_blank" rel="noopener" data-text="google"></a>
      </div>
    </section>

    <p class="closing" data-text="closing"></p>
  </main>

  <script src="public-key.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
